# ==========================================================
# Cloud Build Configuration for Cloud Run Deployment
# Manual Tag Versioning + Always New Code + Cloud Logging
# Region: europe-west1
# ==========================================================

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
timeout: '1200s'

steps:
  # Step 1 – Build Docker image (always fresh)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--no-cache'
      - '-t'
      - 'europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp/myecp-cloud:1.1.5'  # ⬅️ manually update tag here before each build
      - '.'

  # Step 2 – Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp/myecp-cloud:1.1.5'  # ⬅️ same tag as above

  # Step 3 – Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - run
      - deploy
      - 'myecp-cloud'
      - '--image'
      - 'europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp/myecp-cloud:1.1.5'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--quiet'

  # Step 4 – Show deployed service URL in logs
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "✅ Deployment successful!"
        gcloud run services describe myecp-cloud --region europe-west1 --format='value(status.url)'

images:
  - 'europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp/myecp-cloud:1.1.5'
