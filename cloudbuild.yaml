options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Step 1 – Build Docker image (always fresh)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -e
        TAG="1.1.6"  # ⬅️ manually update this tag each time before build (e.g., 1.1.7 next time)
        IMAGE="europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud:${TAG}"
        echo "🏗️ Building image: $IMAGE"
        docker build --no-cache -t "$IMAGE" .

  # Step 2 – Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -e
        TAG="1.1.6"  # ⬅️ same tag as above
        IMAGE="europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud:${TAG}"
        echo "📦 Pushing image: $IMAGE"
        docker push "$IMAGE"

  # Step 3 – Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -e
        TAG="1.1.6"  # ⬅️ same tag as above
        IMAGE="europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud:${TAG}"
        echo "🚀 Deploying $IMAGE to Cloud Run ..."
        gcloud run deploy myecp-cloud \
          --image "$IMAGE" \
          --region europe-west1 \
          --platform managed \
          --allow-unauthenticated \
          --quiet
