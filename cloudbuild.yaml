options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -e

        REPO="asia-south1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud"

        # Get the last tag from Artifact Registry
        LAST_TAG=$(gcloud artifacts docker tags list $REPO \
          --format='value(TAG)' \
          --sort-by=~CREATE_TIME \
          --limit=1)

        echo "Last tag: $LAST_TAG"

        # If no tag found, start with v1.1.1
        if [[ -z "$LAST_TAG" ]]; then
          NEXT_TAG="v1.1.1"
        else
          BASE=$(echo $LAST_TAG | grep -oE '[0-9]+$')
          PREFIX=$(echo $LAST_TAG | sed 's/[0-9]\+$//')
          NEXT_NUM=$((BASE + 1))
          NEXT_TAG="${PREFIX}${NEXT_NUM}"
        fi

        echo "Next tag: $NEXT_TAG" 
        echo $NEXT_TAG > next_tag.txt

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - -c
      - |
        TAG=$(cat next_tag.txt)
        echo "Building image with tag: $TAG"
        docker build -t asia-south1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud:$TAG .

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - -c
      - |
        TAG=$(cat next_tag.txt)
        echo "Pushing image with tag: $TAG"
        docker push asia-south1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud:$TAG

images:
  - "asia-south1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud"
