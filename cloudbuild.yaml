options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: 'asia-south1'
  _SERVICE: 'myecp-cloud'
  _REPO: 'myecp-repo'
  _BRANCH: 'develop'
  _VERSION_TAG: 'v1.1.3' # you can manually bump this for each release
  _IMAGE: 'asia-south1-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}'

steps:
  # Step 1: Build Docker image (always fresh)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build', '--no-cache',
        '-t', '${_IMAGE}:${_BRANCH}-${_VERSION_TAG}-${SHORT_SHA}',
        '.'
      ]

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}:${_BRANCH}-${_VERSION_TAG}-${SHORT_SHA}']

  # Step 3: Deploy new image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - -c
      - |
        echo "🚀 Deploying ${_IMAGE}:${_BRANCH}-${_VERSION_TAG}-${SHORT_SHA} to Cloud Run..."
        gcloud run deploy ${_SERVICE} \
          --image ${_IMAGE}:${_BRANCH}-${_VERSION_TAG}-${SHORT_SHA} \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --quiet

images:
  - '${_IMAGE}:${_BRANCH}-${_VERSION_TAG}-${SHORT_SHA}'
