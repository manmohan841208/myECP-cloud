# ==========================================================
# Cloud Build Configuration for Personal Project
# Project: organic-edge-475807-v2
# Region: europe-west1
# Service: myecp-cloud
# Build Type: Clean build (no cache) + Auto Deploy
# ==========================================================

substitutions:
  _TAG: '1.0.1'  # 👈 bump manually for each release
  _REGION: 'europe-west1'
  _SERVICE_NAME_PERSONAL: 'myecp-cloud'
  _PROJECT_ID_PERSONAL: 'organic-edge-475807-v2'
  _REPO_PATH_PERSONAL: 'cloud-run-source-deploy/myecp'

steps:
  # ========================================================
  # STEP 1: Build Docker image (always fresh)
  # ========================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '--no-cache',  # ensure new image each build
        '-t', 'europe-west1-docker.pkg.dev/${_PROJECT_ID_PERSONAL}/${_REPO_PATH_PERSONAL}/${_SERVICE_NAME_PERSONAL}:${_TAG}',
        '.'
      ]

  # ========================================================
  # STEP 2: Push image to Artifact Registry
  # ========================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'europe-west1-docker.pkg.dev/${_PROJECT_ID_PERSONAL}/${_REPO_PATH_PERSONAL}/${_SERVICE_NAME_PERSONAL}:${_TAG}'
      ]

  # ========================================================
  # STEP 3: Deploy to Cloud Run (Gen1)
  # ========================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      [
        'run', 'deploy', '${_SERVICE_NAME_PERSONAL}',
        '--image', 'europe-west1-docker.pkg.dev/${_PROJECT_ID_PERSONAL}/${_REPO_PATH_PERSONAL}/${_SERVICE_NAME_PERSONAL}:${_TAG}',
        '--region', '${_REGION}',
        '--platform', 'managed',
        '--allow-unauthenticated',
        '--project', '${_PROJECT_ID_PERSONAL}'
      ]

# ==========================================================
# Optional Settings
# ==========================================================

images:
  - 'europe-west1-docker.pkg.dev/${_PROJECT_ID_PERSONAL}/${_REPO_PATH_PERSONAL}/${_SERVICE_NAME_PERSONAL}:${_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
  substitution_option: 'ALLOW_LOOSE'

timeout: '1200s'
