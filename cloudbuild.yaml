options:
  logging: CLOUD_LOGGING_ONLY

# 🔢 Change this manually before each build (example: 1.1.6 → 1.1.7)
substitutions:
  _TAG: "1.1.5"

steps:
  # Step 1 – Build Docker image (no cache)
  - name: gcr.io/cloud-builders/docker
    id: "build-image"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        TAG="${_TAG}"
        IMAGE="europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud:${TAG}"
        echo "🏗️ Building image: $IMAGE ..."
        docker build --no-cache -t "$IMAGE" .

  # Step 2 – Push image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: "push-image"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        TAG="${_TAG}"
        IMAGE="europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud:${TAG}"
        echo "📦 Pushing $IMAGE ..."
        docker push "$IMAGE"

  # Step 3 – Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: "deploy"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        TAG="${_TAG}"
        IMAGE="europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud:${TAG}"
        echo "🚀 Deploying $IMAGE to Cloud Run ..."
        gcloud run deploy myecp-cloud \
          --image "$IMAGE" \
          --region europe-west1 \
          --platform managed \
          --allow-unauthenticated \
          --quiet

# 👇 Remove dynamic substitution here — it breaks builds
images:
  - "europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud"
