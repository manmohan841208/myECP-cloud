options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Step 1: Determine next tag dynamically inside bash
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -e

        echo "🔍 Checking latest tag in Artifact Registry..."
        IMAGE="europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud"

        LAST_TAG=$(gcloud artifacts docker tags list "$IMAGE" \
          --format='value(TAG)' \
          --sort-by=~CREATE_TIME \
          --limit=1 2>/dev/null || true)

        echo "Last tag found: ${LAST_TAG:-none}"

        if [[ -z "$LAST_TAG" ]]; then
          NEXT_TAG="v1.1.1"
        else
          BASE=$(echo "$LAST_TAG" | grep -oE '[0-9]+$' || echo "0")
          PREFIX=$(echo "$LAST_TAG" | sed 's/[0-9]\+$//')
          NEXT_NUM=$((BASE + 1))

          # rollover logic example: after 1.1.10 -> v2.1.1
          if (( NEXT_NUM > 10 )); then
            MAJOR=$(echo "$PREFIX" | grep -oE '[0-9]+' | head -1)
            NEXT_MAJOR=$((MAJOR + 1))
            NEXT_TAG="v${NEXT_MAJOR}.1.1"
          else
            NEXT_TAG="${PREFIX}${NEXT_NUM}"
          fi
        fi

        echo "🆕 Next tag determined: $NEXT_TAG"
        echo "$NEXT_TAG" > next_tag.txt

  # Step 2: Build Docker image with new tag
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -e
        TAG=$(cat next_tag.txt)
        IMAGE="europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud"
        echo "🏗️ Building Docker image: $IMAGE:$TAG"
        docker build --no-cache -t "$IMAGE:$TAG" .

  # Step 3: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -e
        TAG=$(cat next_tag.txt)
        IMAGE="europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud"
        echo "📤 Pushing Docker image: $IMAGE:$TAG"
        docker push "$IMAGE:$TAG"

  # Step 4: Deploy new tag to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - -c
      - |
        set -e
        TAG=$(cat next_tag.txt)
        REGION="europe-west1"
        SERVICE="myecp-cloud"
        IMAGE="europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud:$TAG"

        echo "🚀 Deploying $SERVICE with image $IMAGE in region $REGION"
        gcloud run deploy "$SERVICE" \
          --image "$IMAGE" \
          --region "$REGION" \
          --platform managed \
          --allow-unauthenticated \
          --quiet

images:
  - "europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud"
