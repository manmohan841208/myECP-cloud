options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: "europe-west1"
  _SERVICE: "myecp"

steps:
  # Step 1: Build Docker image (no cache)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '--no-cache',
        '-t', 'gcr.io/${PROJECT_ID}/${_SERVICE}:$SHORT_SHA',
        '.'
      ]

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'gcr.io/${PROJECT_ID}/${_SERVICE}:$SHORT_SHA'
      ]

  # Step 3: Deploy image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - -c
      - |
        gcloud run deploy ${_SERVICE} \
          --image gcr.io/${PROJECT_ID}/${_SERVICE}:$SHORT_SHA \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --quiet

images:
  - 'gcr.io/${PROJECT_ID}/${_SERVICE}:$SHORT_SHA'
