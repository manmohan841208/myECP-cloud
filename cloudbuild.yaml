options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Step 1 – Read tag from version/tag.txt
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: "read-tag"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        TAG=$(cat version/tag.txt)
        echo "🧾 Using tag: $TAG"
        echo "$TAG" > /workspace/tag.txt

  # Step 2 – Build Docker image (always fresh, with no cache)
  - name: gcr.io/cloud-builders/docker
    id: "build-image"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        TAG=$(cat /workspace/tag.txt)
        IMAGE="europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud:${TAG}"
        echo "🏗️ Building image: $IMAGE ..."
        docker build --no-cache -t "$IMAGE" .

  # Step 3 – Push image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: "push-image"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        TAG=$(cat /workspace/tag.txt)
        IMAGE="europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud:${TAG}"
        echo "📦 Pushing $IMAGE ..."
        docker push "$IMAGE"

  # Step 4 – Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: "deploy"
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        TAG=$(cat /workspace/tag.txt)
        IMAGE="europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud:${TAG}"
        echo "🚀 Deploying $IMAGE to Cloud Run ..."
        gcloud run deploy myecp-cloud \
          --image "$IMAGE" \
          --region europe-west1 \
          --platform managed \
          --allow-unauthenticated \
          --quiet

images:
  - "europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp-repo/myecp-cloud:$(cat version/tag.txt)"
