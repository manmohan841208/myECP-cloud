name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: organic-edge-475807-v2
        service_account_key: ${{ secrets.GCP_SA_KEY }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies and rebuild native modules
      run: |
        rm -rf node_modules package-lock.json
        npm install --include=optional
        npm rebuild sharp --platform=linux --arch=x64
        npm run build --if-present

    - name: Build Docker image (always new)
      run: |
        IMAGE_TAG=$(date +'%Y%m%d-%H%M%S')
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
        docker build --no-cache -t europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp/myecp-cloud:$IMAGE_TAG .

    - name: Push image to Artifact Registry
      run: docker push europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp/myecp-cloud:${{ env.IMAGE_TAG }}

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy myecp-cloud \
          --image europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp/myecp-cloud:${{ env.IMAGE_TAG }} \
          --region europe-west1 \
          --platform managed \
          --allow-unauthenticated
