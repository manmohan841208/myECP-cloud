name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: organic-edge-475807-v2
        service_account_key: ${{ secrets.GCP_SA_KEY }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

    - name: Build Docker image (no cache)
      run: |
        docker build --no-cache -t europe-west1-docker.pkg.dev/organic-edge-475807-v2/cloud-run-source-deploy/myecp-cloud:latest .

    - name: Push image to Artifact Registry
      run: docker push europe-west1-docker.pkg.dev/organic-edge-475807-v2/cloud-run-source-deploy/myecp-cloud:latest

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy myecp-cloud \
          --image europe-west1-docker.pkg.dev/organic-edge-475807-v2/cloud-run-source-deploy/myecp-cloud:latest \
          --region europe-west1 \
          --platform managed \
          --allow-unauthenticated
