name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - develop   # Trigger only when you push to the 'develop' branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 🪣 Step 1: Checkout the latest code
    - name: Checkout code
      uses: actions/checkout@v4

    # 🔑 Step 2: Set up Google Cloud SDK
    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: organic-edge-475807-v2
        service_account_key: ${{ secrets.GCP_SA_KEY }}

    # ⚙️ Step 3: Authenticate Docker with Artifact Registry
    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

    # 🧱 Step 4: Build Docker image (force rebuild every time)
    - name: Build Docker image (always fresh, no cache)
      run: |
        IMAGE_NAME="europe-west1-docker.pkg.dev/organic-edge-475807-v2/cloud-run-source-deploy/myecp-cloud"
        IMAGE_TAG=$(date +%Y%m%d%H%M%S)
        echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

        echo "🛠️ Building image: $IMAGE_NAME:$IMAGE_TAG"
        docker build --no-cache -t $IMAGE_NAME:$IMAGE_TAG .

    # 🚀 Step 5: Push the image to Artifact Registry
    - name: Push image to Artifact Registry
      run: |
        docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

    # ☁️ Step 6: Deploy to Cloud Run with new revision
    - name: Deploy to Cloud Run
      run: |
        echo "🚀 Deploying new revision: ${{ env.IMAGE_TAG }}"
        gcloud run deploy myecp-cloud \
          --image ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
          --region europe-west1 \
          --platform managed \
          --allow-unauthenticated
