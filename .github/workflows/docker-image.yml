name: Build and Deploy to Cloud Run

on:
  workflow_dispatch:  # allows manual and CI-triggered runs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: organic-edge-475807-v2
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build Docker image (always new)
        run: |
          IMAGE_TAG=$(date +'%Y%m%d-%H%M%S')
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          docker build --no-cache -t europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp/myecp-cloud:$IMAGE_TAG .

      - name: Push image to Artifact Registry
        run: docker push europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp/myecp-cloud:${{ env.IMAGE_TAG }}

      - name: Deploy to Cloud Run (force new revision)
        run: |
          gcloud run deploy myecp-cloud \
            --image europe-west1-docker.pkg.dev/organic-edge-475807-v2/myecp/myecp-cloud:${{ env.IMAGE_TAG }} \
            --region europe-west1 \
            --platform managed \
            --allow-unauthenticated \
            --quiet \
            --set-env-vars "NEXT_PUBLIC_BUILD_TIME=$(date +'%s')" \
            --revision-suffix="rev-${{ env.IMAGE_TAG }}"
